<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Formulário de Ocorrências CME</title>
<style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2f4f8;
      padding: 20px;
      color: #2d3436;
    }
    .container {
      max-width: 960px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      margin: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #0984e3;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
    }
    .form-group {
      flex: 1 1 250px;
      display: flex;
      flex-direction: column;
    }

    /* Ajuste para melhor aproveitamento da primeira linha */
    .form-row:first-of-type .form-group {
      flex: 1 1 calc(50% - 15px);
    }
    label {
      font-weight: 600;
      margin-bottom: 5px;
    }
    input, select, textarea {
      padding: 10px;
      border: 1px solid #dfe6e9;
      border-radius: 6px;
      font-size: 1rem;
    }
    textarea {
      height: 250px;
      resize: vertical;
      margin-top: 10px;
      font-family: inherit;
    }
    button {
      background: #00b894;
      color: white;
      padding: 14px 28px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background: #019875;
    }
  </style>
</head>
<body>
<div class="container">
<div style="text-align: center; margin-bottom: 20px;"><img alt="Logo Polícia Penal AP" src="logo-pp.png" style="max-width: 100px; height: auto;"/></div><h1>BOLETIM DE OCORRÊNCIAS - ATIVIDADES DIÁRIAS</h1>
<form id="formOcorrencia">
<div class="form-row">
<div class="form-group">
<label for="assunto">Assunto:</label>
<select id="assunto" name="assunto">
<option value="">--Escolha--</option>
<option value="vinculacao">VINCULAÇÃO</option>
<option value="vinc_jvd">VINCULAÇÃO JVD</option>
<option value="desvinculacao">DESVINCULAÇÃO</option>
<option value="troca_tornozeleira">TROCA/SUBSTITUIÇÃO DE TORNOZELEIRA</option>
<option value="just_saida_zona">JUSTIFICATIVA DE SAÍDA DE ZONA</option>
<option value="just_atestado_medico">JUSTIFICATIVA ATESTADO MÉDICO</option>
<option value="inspecao_tornozeleira">INSPEÇÃO DE TORNOZELEIRA</option>
<option value="tempo_limite_ausencia_gprs">TEMPO LIMITE AUSÊNCIA GPRS</option>
<option value="permuta_servidor_plantao">PERMUTA SERVIDOR/PLANTÃO</option>
<option value="informativo_entrega_declaracao">INFORMATIVO – ENTREGA DE DECLARAÇÃO</option>
<option value="informativo_atualizacao_cadastral">INFORMATIVO – ATUALIZAÇÃO CADASTRAL</option>
<option value="alteracao_endereco_zona">ALTERAÇÃO ENDEREÇO/ZONA</option>
<option value="vinc_dpp">VINCULAÇÃO – DPP</option>
</select>
</div>

<div class="form-group">
<label for="alvara">Alvará N.º:</label>
<input id="alvara" name="alvara" type="text"/>
</div>
</div>
<div class="form-row">
<div class="form-group">
<label for="nome">Nome do Monitorado:</label>
<input id="nome" name="nome" type="text"/>
</div>
<div class="form-group">
<label for="tnz">TNZ ANTIGA:</label>
<input id="tnz" name="tnz" type="text"/>
</div>
<div class="form-group">
<label for="tnzNova">TNZ NOVA:</label>
<input id="tnzNova" name="tnzNova" type="text"/>
</div>
<div class="form-group">
<label for="processo">Processo Nº:</label>
<input id="processo" name="processo" type="text"/>
</div>
</div>
<div class="form-group">
<label for="textoGerado">Texto Padrão Gerado (editável):</label>
<textarea id="textoGerado" name="textoGerado"></textarea>
</div>
<button id="btnCopiar" type="button">Copiar Texto</button>
</form>
</div>
<script>
  const form = document.getElementById('formOcorrencia');
  const assunto = document.getElementById('assunto');
    const alvara = document.getElementById('alvara');
  const nome = document.getElementById('nome');
  const tnz = document.getElementById('tnz');
  const tnzNova = document.getElementById('tnzNova');
  const processo = document.getElementById('processo');
  const textoGerado = document.getElementById('textoGerado');
  const btnCopiar = document.getElementById('btnCopiar');

  function formatDataHora() {
    const now = new Date();
    const dia = String(now.getDate()).padStart(2, '0');
    const mes = String(now.getMonth() + 1).padStart(2, '0');
    const ano = now.getFullYear();
    const hora = String(now.getHours()).padStart(2, '0');
    const minuto = String(now.getMinutes()).padStart(2, '0');
    return {
      data: `${dia}/${mes}/${ano}`,
      hora: `${hora}:${minuto}`
    };
  }

  function gerarTexto() {
    const { data, hora } = formatDataHora();
        const alvaraVal = (alvara.value.trim() || '[ALVARÁ N.º]').toUpperCase();
    const nomeVal = (nome.value.trim() || '[NOME]').toUpperCase();
    const tnzVal = (tnz.value.trim() || '[TNZ N.º]').toUpperCase();
    const processoVal = (processo.value.trim() || '[PROCESSO N.º]').toUpperCase();

    let texto = '';

    switch (assunto.value) {
      case 'desvinculacao':
        texto = `INFORMA-SE QUE O MONITORADO ${nomeVal} COMPARECEU A ESTA CENTRAL DE MONITORAÇÃO ELETRÔNICA (CME) NO DIA ${data}, ÀS ${hora}, PARA A RETIRADA DO DISPOSITIVO DE MONITORAÇÃO ELETRÔNICA (TORNOZELEIRA) DE N.º ${tnzVal}, EM CUMPRIMENTO À DECISÃO JUDICIAL PROFERIDA NOS AUTOS DO PROCESSO Nº ${processoVal}. A DESVINCULAÇÃO FOI FORMALIZADA POR MEIO DE TERMO DE DESVINCULAÇÃO, DEVIDAMENTE ASSINADO PELO MONITORADO E PELO SERVIDOR RESPONSÁVEL PELO PROCEDIMENTO, EM CONFORMIDADE COM OS PROTOCOLOS INSTITUCIONAIS VIGENTES.`;
        break;
      case 'vinculacao':
        texto = `INFORMA-SE QUE FOI EFETUADO O PROCEDIMENTO DE VINCULAÇÃO AO SISTEMA AKILES DO MONITORADO ${nomeVal}, NOS TERMOS DO DISPOSITIVO Nº ${tnzVal}, EM CUMPRIMENTO À DETERMINAÇÃO JUDICIAL CONSTANTE NOS AUTOS DO PROCESSO Nº ${processoVal} E ALVARÁ Nº ${alvaraVal}. ADEMAIS, TODOS OS DOCUMENTOS PERTINENTES AO REFERIDO PROCEDIMENTO FORAM DIGITALIZADOS E DEVIDAMENTE ARQUIVADOS NA PASTA DO MONITORADO, DISPONÍVEL NO GOOGLE DRIVE DESTA CME.`;
        break;
      case 'vinc_jvd':
        texto = `INFORMA-SE QUE FOI EFETUADO O PROCEDIMENTO DE VINCULAÇÃO AO SISTEMA AKILES DO MONITORADO ${nomeVal}, NOS TERMOS DO DISPOSITIVO Nº ${tnzVal}, EM CUMPRIMENTO À DETERMINAÇÃO JUDICIAL CONSTANTE NOS AUTOS DO PROCESSO Nº ${processoVal} E ALVARÁ Nº ${alvaraVal}, NO ÂMBITO DO JUIZADO ESPECIAL DE VIOLÊNCIA DOMÉSTICA (JVD). TODOS OS DOCUMENTOS PERTINENTES AO REFERIDO PROCEDIMENTO FORAM DIGITALIZADOS E ARMAZENADOS NA PASTA DO MONITORADO NO GOOGLE DRIVE DESTA CME.`;
        break;
      case 'vinc_dpp':
        texto = `INFORMA-SE QUE FOI EFETUADO O PROCEDIMENTO DE VINCULAÇÃO AO SISTEMA AKILES DO MONITORADO ${nomeVal}, NOS TERMOS DO DISPOSITIVO Nº ${tnzVal}, EM CUMPRIMENTO À DETERMINAÇÃO JUDICIAL CONSTANTE NOS AUTOS DO PROCESSO Nº ${processoVal} E ALVARÁ Nº ${alvaraVal}, NO ÂMBITO DA DELEGACIA DE POLÍCIA DA PESSOA (DPP). TODOS OS DOCUMENTOS PERTINENTES AO REFERIDO PROCEDIMENTO FORAM DIGITALIZADOS E ARQUIVADOS NA PASTA DO MONITORADO NO GOOGLE DRIVE DESTA CME.`;
        break;
      case 'troca_tornozeleira':
        const tnzNovaVal = (tnzNova.value.trim() || '[NOVA TNZ]').toUpperCase();
        texto = `TROCA/SUBSTITUIÇÃO DE TORNOZELEIRA: INFORMA-SE QUE O MONITORADO ${nomeVal} COMPARECEU A ESTA CME NO DIA ${data}, ÀS ${hora.replace(':','H')}MIN, PARA REALIZAÇÃO DE TROCA/SUBSTITUIÇÃO DA TORNOZELEIRA ELETRÔNICA Nº ${tnzVal}. APÓS INSPEÇÃO TÉCNICA DO DISPOSITIVO, FOI CONSTATADA AVARIA NO PINO POWER JACK, MOTIVO PELO QUAL SE FEZ NECESSÁRIA A SUBSTITUIÇÃO DO EQUIPAMENTO. REGISTRA-SE QUE A NOVA TORNOZELEIRA INSTALADA PASSOU A SER A DE Nº ${tnzNovaVal}.`;
        break;
      case 'just_saida_zona':
        texto = `INFORMA-SE QUE COMPARECEU A ESTA CME O MONITORADO ${nomeVal}, ONDE FOI REGISTRADA JUSTIFICATIVA PARA SAÍDA DA ZONA DE INCLUSÃO (PERÍMETRO DELIMITADO) NO SISTEMA AKILES NA DATA DE ${data}, ÀS ${hora}, CONFORME DOCUMENTO APRESENTADO PELO MONITORADO QUE FOI DEVIDAMENTE DIGITALIZADO E ARQUIVADO EM SUA PASTA NO GOOGLE DRIVE DESTA CME.`;
        break;
      case 'just_atestado_medico':
        texto = `INFORMA-SE QUE COMPARECEU A ESTA CME [NOME DA PESSOA E GRAU DE PARENTESCO] DO MONITORADO ${nomeVal}, NA DATA DE ${data}, ÀS ${hora}, OCASIÃO EM QUE ENTREGOU ATESTADO MÉDICO EMITIDO PELO [NOME DO HOSPITAL], INFORMANDO QUE O REFERIDO MONITORADO PERMANECERÁ INTERNADO NO PERÍODO DE [PERÍODO], PARA TRATAMENTO MÉDICO. O DOCUMENTO ESTÁ ASSINADO PELO MÉDICO [NOME DO MÉDICO], CRM [NÚMERO DO CRM].`;
        break;
      case 'inspecao_tornozeleira':
        texto = `INFORMAMOS QUE FOI REALIZADA INSPEÇÃO DA TORNOZELEIRA ELETRÔNICA N.º ${tnzVal}, DO MONITORADO ${nomeVal}, NA DATA DE ${data}, ÀS ${hora}, CONFORME PROTOCOLO INSTITUCIONAL VIGENTE. EVENTUAIS IRREGULARIDADES FORAM REGISTRADAS E ENCAMINHADAS PARA PROVIDÊNCIAS CABÍVEIS.`;
        break;
      case 'tempo_limite_ausencia_gprs':
        texto = `COMUNICA-SE QUE O MONITORADO ${nomeVal} ULTRAPASSOU O TEMPO LIMITE DE AUSÊNCIA DE COMUNICAÇÃO GPRS PREVISTO NO SISTEMA AKILES, TENDO OCORRIDO EM ${data}, ÀS ${hora}. AS MEDIDAS CABÍVEIS FORAM ACIONADAS CONFORME NORMATIVA INTERNA.`;
        break;
      case 'permuta_servidor_plantao':
        texto = `REGISTRA-SE QUE HOUVE PERMUTA DE SERVIDOR/PLANTÃO, REALIZADA EM ${data}, ÀS ${hora}, CONFORME DOCUMENTAÇÃO ANEXA E EM CONFORMIDADE COM OS PROTOCOLOS DESTA CME.`;
        break;
      case 'informativo_entrega_declaracao':
        texto = `INFORMAMOS QUE FOI REALIZADA ENTREGA DE DECLARAÇÃO AO MONITORADO ${nomeVal} NA DATA DE ${data}, ÀS ${hora}. O DOCUMENTO FOI PROTOCOLADO E ARQUIVADO NA PASTA DO MONITORADO NO GOOGLE DRIVE.`;
        break;
      case 'informativo_atualizacao_cadastral':
        texto = `INFORMAMOS QUE FOI REALIZADA ATUALIZAÇÃO CADASTRAL DO MONITORADO ${nomeVal} NA DATA DE ${data}, ÀS ${hora}, COM OS DADOS FORNECIDOS E ARQUIVADOS CONFORME PROCEDIMENTO PADRÃO.`;
        break;
      case 'alteracao_endereco_zona':
        texto = `INFORMA-SE QUE O MONITORADO ${nomeVal} COMPARECEU A ESTA CME NO DIA ${data}, ÀS ${hora}, PARA REQUERER ALTERAÇÃO DE ENDEREÇO E ZONA DE INCLUSÃO PARA O ENDEREÇO INFORMADO, PARA FINS DE ATUALIZAÇÃO CADASTRAL JUNTO À CENTRAL DE MONITORAMENTO ELETRÔNICO - IAPEN/CME/AP. COMPROVANTE DO NOVO ENDEREÇO E REQUERIMENTO ASSINADO FORAM DIGITALIZADOS E ARQUIVADOS NA PASTA DO MONITORADO NO GOOGLE DRIVE DESTA CME.`;
        break;
      default:
        texto = '';
    }

    const assuntoTexto = assunto.options[assunto.selectedIndex]?.text || '';

    if (assuntoTexto) {
      texto = `${assuntoTexto.toUpperCase()}\n\n${texto}`;
    }

    textoGerado.value = texto;
  }

  [assunto, alvara, nome, tnz, tnzNova, processo].forEach(el => {
    el.addEventListener('input', gerarTexto);
  });

  btnCopiar.addEventListener('click', () => {
    textoGerado.select();
    textoGerado.setSelectionRange(0, 99999);
    document.execCommand('copy');
    alert('Texto copiado para a área de transferência!');
  });

  window.onload = gerarTexto;
</script>
</body>
</html>
